# =============================================================================
# DO NOT EDIT THIS FILE DIRECTLY.
# Generated from ~/.config/starship/starship.org
# Edit that file, tangle with `tangle starship`,
# then restart your shell for changes to take effect.
# =============================================================================

add_newline = false
palette = "catppuccin_mocha"

[palettes.catppuccin_mocha]
black = "#45475A"
red = "#F38BA8"
green = "#A6E3A1"
yellow = "#F9E2AF"
blue = "#89B4FA"
magenta = "#CBA6F7"
cyan = "#94E2D5"
white = "#CDD6F4"

format = """
$directory$git_branch$git_status$cmd_duration$time
$character
"""

[directory]
style = "blue bold"
truncate_to_repo = true
truncation_length = 3
read_only = " "
read_only_style = "red"

[git_branch]
symbol = " "
style = "magenta bold"

[git_status]
style = "yellow"
conflicted = " "   # Merge conflicts
ahead = "⇡${count}" # Commits ahead of remote
behind = "⇣${count}" # Commits behind remote
staged = " "       # Staged changes
modified = " "     # Modified files
deleted = " "      # Deleted files
untracked = " "    # Untracked files

[cmd_duration]
min_time = 500
format = "⏱ $duration"
style = "cyan"

[time]
disabled = false
format = "[$time]($style) "
style = "bold bright-black"

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
vicmd_symbol = "[❮](blue)"
