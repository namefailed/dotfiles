    - "(⚕)"
    - "(🪽)"
    - "(⟡)"
    - "(✦)"
    - "(≈)"
  thinking_faces:
    - "(⚕)"
    - "(✦)"
    - "(⟡)"
    - "(⌁)"
    - "(🪽)"
  thinking_verbs:
    - "bearing messages"
    - "donning winged sandals"
    - "crossing the sky"
    - "reading the omens"
    - "consulting the fates"
    - "weaving words"
    - "measuring the wind"
    - "charting swift paths"
  wings:
    - ["⟪🪽", "🪽⟫"]
    - ["⟪≈", "≈⟫"]
    - ["⟪✦", "✦⟫"]
    - ["⟪⟡", "⟡⟫"]

branding:
  agent_name: "Hermes"
  welcome: "Hermes — swift and ready 🪽"
  goodbye: "May Hermes guide your path! 🪽"
  response_label: " 🪽 Hermes "
  prompt_symbol: "🪽"
  help_header: "(🪽) Commands of the Herald"

tool_prefix: "┊"

tool_emojis:
  web_search: "🔮"
  browser: "🌐"
  terminal: "⚡"
  memory: "🧠"
  delegate_task: "☿"
