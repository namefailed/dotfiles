# Hermes Agent CLI Configuration
# DO NOT EDIT THIS FILE DIRECTLY. Edit hermes.org and tangle.

model:
  # Everyday default = fast cloud model (local qwen3 prefills Hermes's big prompt
  # too slowly on the GPU — ~60s vs ~6s). Local GPU stays available via /model
  # using the pan-gpu custom provider defined below.
  default: deepseek-v4-flash
  provider: opencode-go
fallback_providers:
  - provider: opencode-go
    model: deepseek-v4-flash
  - provider: opencode-zen
    model: deepseek-v4-flash

terminal:
  backend: local
  cwd: .
  timeout: 180
  lifetime_seconds: 300
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true

browser:
  inactivity_timeout: 120

memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  nudge_interval: 10
  flush_min_turns: 6

skills:
  creation_nudge_interval: 15

agent:
  max_turns: 60
  reasoning_effort: medium
  verbose: false

display:
  compact: true
  tool_progress: all
  streaming: true
  skin: hermes
  bell_on_complete: false
  show_reasoning: false

streaming:
  enabled: false

session_reset:
  mode: both
  idle_minutes: 1440
  at_hour: 4

compression:
  enabled: true
  threshold: 0.50
  target_ratio: 0.20
  protect_last_n: 20
  protect_first_n: 3

auxiliary:
  compression:
    provider: custom
    model: qwen2.5-coder:1.5b
    base_url: http://localhost:11434/v1

tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: false
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5

platform_toolsets:
  cli: [hermes-cli]
  telegram: [hermes-telegram]
  discord: [hermes-discord]
  whatsapp: [hermes-whatsapp]
  slack: [hermes-slack]
  signal: [hermes-signal]
  homeassistant: [hermes-homeassistant]
  qqbot: [hermes-qqbot]
  yuanbao: [hermes-yuanbao]
  teams: [hermes-teams]
  google_chat: [hermes-google_chat]

stt:
  enabled: true
  provider: local
  local:
    model: base

code_execution:
  timeout: 300
  max_tool_calls: 50

delegation:
  max_iterations: 50

custom_providers:
  - name: pan-gpu
    base_url: "http://***.***.***.***:11434/v1"  # FIXME: replace with actual local IP
    api_key: ""
    models:
      - qwen3:8b-64k
      - gemma4:e4b

prompt_caching:
  cache_ttl: 5m

mcp_servers:
  basic-memory:
    url: "http://127.0.0.1:8765/mcp"
    timeout: 30
