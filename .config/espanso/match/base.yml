# yaml-language-server: $schema=https://raw.githubusercontent.com/espanso/espanso/dev/schemas/match.schema.json

# =============================================================================
# DO NOT EDIT THIS FILE DIRECTLY.
# Generated from ~/.config/espanso/espanso.org
# Edit that file, then restart Espanso after tangling.
# =============================================================================

matches:
  # ------------------------------------------------------------------
  # BASICS
  # ------------------------------------------------------------------

  - trigger: ":espanso"
    replace: "Hi there!"

  # -- Standard Timestamps ----------------------------------------

  - trigger: ":date"
    replace: "{{today}}"
    label: Insert date as YYYY-MM-DD
    vars:
      - name: today
        type: date
        params:
          format: "%Y-%m-%d"

  - trigger: ":time"
    replace: "{{now}}"
    label: Insert time as HH:MM
    vars:
      - name: now
        type: date
        params:
          format: "%H:%M"

  - trigger: ":now"
    replace: "{{stamp}}"
    label: Insert timestamp as YYYY-MM-DD HH:MM
    vars:
      - name: stamp
        type: date
        params:
          format: "%Y-%m-%d %H:%M"

  - trigger: ":orgts"
    replace: "{{orgstamp}}"
    label: Insert Org timestamp like [2026-05-14 Thu 09:30]
    vars:
      - name: orgstamp
        type: date
        params:
          format: "[%Y-%m-%d %a %H:%M]"

  # ------------------------------------------------------------------
  # DENOTE HELPERS
  # ------------------------------------------------------------------

  - trigger: ":denote"
    replace: "[[denote:{{denotestamp}}|$|$]]"
    label: Insert Denote link with current timestamp
    vars:
      - name: denotestamp
        type: date
        params:
          format: "%Y%m%dT%H%M%S"

  # ------------------------------------------------------------------
  # ORG LOGGING KEYWORDS -- journal.org and tasks.org workflow
  # ------------------------------------------------------------------

  - trigger: ":log"
    replace: "- {{orgstamp}} "
    label: Insert Org-style log bullet with timestamp
    vars:
      - name: orgstamp
        type: date
        params:
          format: "[%Y-%m-%d %a %H:%M]"

  - trigger: ":done"
    replace: "- DONE {{orgstamp}} "
    label: Insert DONE log entry with timestamp
    vars:
      - name: orgstamp
        type: date
        params:
          format: "[%Y-%m-%d %a %H:%M]"

  - trigger: ":wait"
    replace: "- WAITING {{orgstamp}} "
    label: Insert WAITING log entry with timestamp
    vars:
      - name: orgstamp
        type: date
        params:
          format: "[%Y-%m-%d %a %H:%M]"

  - trigger: ":blocked"
    replace: "- BLOCKED {{orgstamp}} "
    label: Insert BLOCKED log entry with timestamp
    vars:
      - name: orgstamp
        type: date
        params:
          format: "[%Y-%m-%d %a %H:%M]"

  # ------------------------------------------------------------------
  # TASK HELPERS
  # ------------------------------------------------------------------

  - trigger: ":cb"
    replace: "- [ ] "
    label: Insert unchecked checkbox

  - trigger: ":orgtodo"
    replace: "TODO "
    label: Insert Org TODO keyword

  - trigger: ":orglink"
    replace: "[[$|$]]"
    label: Insert Org link skeleton

  # ------------------------------------------------------------------
  # SYMBOLS
  # ------------------------------------------------------------------

  - trigger: ":rarrow"
    replace: "→"
    label: Insert right arrow

  - trigger: ":larrow"
    replace: "←"
    label: Insert left arrow

  - trigger: ":uarrow"
    replace: "↑"
    label: Insert up arrow

  - trigger: ":darrow"
    replace: "↓"
    label: Insert down arrow

  - trigger: ":bull"
    replace: "•"
    label: Insert bullet symbol

  - trigger: ":check"
    replace: "✓"
    label: Insert checkmark

  - trigger: ":xmark"
    replace: "✗"
    label: Insert X mark

  - trigger: ":star"
    replace: "★"
    label: Insert star
